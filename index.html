<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spokes AI Agents | Knowledge26 Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #061525;
      color: #e8f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header-img, .footer-img {
      width: 100%;
      display: block;
      flex-shrink: 0;
    }
    .ttt-card {
      background: rgba(10,31,51,0.85);
      border: 1px solid rgba(98,216,78,0.15);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(98,216,78,0.10);
      padding: 32px 28px 28px 28px;
      max-width: 370px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .ttt-title {
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: #62d84e;
      letter-spacing: 1px;
      text-align: center;
    }
    .ttt-status {
      font-size: 1.1rem;
      font-weight: 500;
      color: #e8f4f8;
      margin-bottom: 18px;
      min-height: 28px;
      text-align: center;
      transition: color 0.2s;
    }
    .ttt-board {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(3, 64px);
      gap: 10px;
      margin-bottom: 22px;
    }
    .ttt-cell {
      width: 64px;
      height: 64px;
      background: rgba(6,21,37,0.8);
      border: 2px solid rgba(98,216,78,0.2);
      border-radius: 10px;
      font-size: 2.2rem;
      font-weight: 700;
      color: #e8f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      user-select: none;
      outline: none;
    }
    .ttt-cell.winner {
      background: linear-gradient(135deg, #62d84e, #00c7b1);
      color: #061525;
      border-color: #62d84e;
      box-shadow: 0 0 12px #62d84e88;
      animation: winner-glow 1s infinite alternate;
    }
    @keyframes winner-glow {
      from { box-shadow: 0 0 12px #62d84e88; }
      to { box-shadow: 0 0 24px #00c7b188; }
    }
    .ttt-reset-btn {
      background: linear-gradient(135deg, #62d84e, #00c7b1);
      color: #061525;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 2px 8px rgba(98,216,78,0.10);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .ttt-reset-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 4px 16px #00c7b144;
    }
    @media (max-width: 500px) {
      .ttt-card {
        padding: 18px 6px 16px 6px;
        max-width: 98vw;
      }
      .ttt-board {
        grid-template-columns: repeat(3, 48px);
        grid-template-rows: repeat(3, 48px);
        gap: 7px;
      }
      .ttt-cell {
        width: 48px;
        height: 48px;
        font-size: 1.5rem;
      }
      .ttt-title {
        font-size: 1.3rem;
      }
      .ttt-reset-btn {
        font-size: 1rem;
        padding: 10px 18px;
      }
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div class="ttt-card">
      <div class="ttt-title">Tic-Tac-Toe</div>
      <div id="ttt-status" class="ttt-status">Player X's turn</div>
      <div id="ttt-board" class="ttt-board">
        <div class="ttt-cell" data-index="0" tabindex="0"></div>
        <div class="ttt-cell" data-index="1" tabindex="0"></div>
        <div class="ttt-cell" data-index="2" tabindex="0"></div>
        <div class="ttt-cell" data-index="3" tabindex="0"></div>
        <div class="ttt-cell" data-index="4" tabindex="0"></div>
        <div class="ttt-cell" data-index="5" tabindex="0"></div>
        <div class="ttt-cell" data-index="6" tabindex="0"></div>
        <div class="ttt-cell" data-index="7" tabindex="0"></div>
        <div class="ttt-cell" data-index="8" tabindex="0"></div>
      </div>
      <button id="ttt-reset" class="ttt-reset-btn">Reset Game</button>
    </div>
  </div>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
  <script>
    // --- JAVASCRIPT FIRST ---
    const board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameActive = true;
    const statusDiv = document.getElementById('ttt-status');
    const boardDiv = document.getElementById('ttt-board');
    const resetBtn = document.getElementById('ttt-reset');
    const cells = Array.from(document.getElementsByClassName('ttt-cell'));
    const winCombos = [
      [0,1,2],[3,4,5],[6,7,8], // rows
      [0,3,6],[1,4,7],[2,5,8], // cols
      [0,4,8],[2,4,6] // diags
    ];
    function setStatus(msg, color) {
      statusDiv.textContent = msg;
      statusDiv.style.color = color || '#e8f4f8';
    }
    function handleCellClick(e) {
      const idx = Number(e.target.dataset.index);
      if (!gameActive || board[idx]) return;
      board[idx] = currentPlayer;
      e.target.textContent = currentPlayer;
      e.target.classList.remove('winner');
      const winner = checkWinner();
      if (winner) {
        highlightWinner(winner.combo);
        setStatus(`Player ${winner.player} wins! 🎉`, '#62d84e');
        gameActive = false;
      } else if (board.every(cell => cell)) {
        setStatus("It's a draw!", '#00c7b1');
        gameActive = false;
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        setStatus(`Player ${currentPlayer}'s turn`);
      }
    }
    function checkWinner() {
      for (const combo of winCombos) {
        const [a,b,c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { player: board[a], combo };
        }
      }
      return null;
    }
    function highlightWinner(combo) {
      for (const idx of combo) {
        cells[idx].classList.add('winner');
      }
    }
    function resetGame() {
      for (let i=0; i<9; ++i) {
        board[i] = null;
        cells[i].textContent = '';
        cells[i].classList.remove('winner');
      }
      currentPlayer = 'X';
      gameActive = true;
      setStatus("Player X's turn");
    }
    function handleCellKey(e) {
      if (!gameActive) return;
      const idx = Number(e.target.dataset.index);
      if ((e.key === 'Enter' || e.key === ' ') && !board[idx]) {
        handleCellClick({target: e.target});
      }
    }
    cells.forEach(cell => {
      cell.addEventListener('click', handleCellClick);
      cell.addEventListener('keydown', handleCellKey);
    });
    resetBtn.addEventListener('click', resetGame);
    // Accessibility: focus first cell on load
    window.addEventListener('DOMContentLoaded', () => {
      cells[0].focus();
    });
  </script>
</body>
</html>
