<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spokes AI Agents | Knowledge26 Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #061525;
      color: #e8f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header-img, .footer-img {
      width: 100%;
      display: block;
      flex-shrink: 0;
    }
    .game-card {
      background: rgba(10,31,51,0.85);
      border: 1px solid rgba(98,216,78,0.15);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 0 20px rgba(98,216,78,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score {
      font-size: 1.5rem;
      font-weight: 700;
      color: #62d84e;
      margin-bottom: 16px;
    }
    .canvas-wrapper {
      position: relative;
      width: 320px;
      height: 480px;
      background: #0a1f33;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #62d84e;
      margin-bottom: 24px;
      box-shadow: 0 0 12px #00c7b1;
    }
    .restart-btn {
      background: linear-gradient(135deg, #62d84e, #00c7b1);
      color: #061525;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px 24px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 12px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 8px #62d84e;
    }
    .status {
      color: #7a9bb5;
      font-size: 1.1rem;
      margin-top: 8px;
      min-height: 24px;
      text-align: center;
    }
    @media (max-width: 600px) {
      .game-card {
        padding: 16px 8px;
        max-width: 98vw;
      }
      .canvas-wrapper {
        width: 98vw;
        max-width: 320px;
        height: 320px;
      }
    }
  </style>
</head>
<body>

  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />

  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div class="game-card">
      <div class="score" id="score">Score: 0</div>
      <div class="canvas-wrapper">
        <canvas id="balloon-canvas" width="320" height="480"></canvas>
      </div>
      <button class="restart-btn" id="restart-btn">Restart Game</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />

  <script>
// Balloon Shooting Game
const canvas = document.getElementById('balloon-canvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score');
const statusDisplay = document.getElementById('status');
const restartBtn = document.getElementById('restart-btn');

const balloonColors = ['#62d84e', '#00c7b1', '#e8f4f8', '#7a9bb5', '#0e2d47'];
const popSoundUrl = 'https://cdn.pixabay.com/audio/2022/03/15/audio_115b7e7c7b.mp3'; // pop
const missSoundUrl = 'https://cdn.pixabay.com/audio/2022/03/15/audio_115b7e7c7b.mp3'; // same for miss (can be replaced)
let popSound, missSound;

let balloons = [];
let score = 0;
let gameActive = true;
let spawnInterval;
let moveInterval;

function loadSounds() {
  popSound = new Audio(popSoundUrl);
  missSound = new Audio(missSoundUrl);
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function spawnBalloon() {
  const radius = randomInt(22, 36);
  const x = randomInt(radius, canvas.width - radius);
  const color = balloonColors[randomInt(0, balloonColors.length - 1)];
  const speed = randomInt(2, 4);
  balloons.push({ x, y: canvas.height + radius, radius, color, speed });
}

function moveBalloons() {
  for (let i = 0; i < balloons.length; i++) {
    balloons[i].y -= balloons[i].speed;
  }
  // Remove balloons that have gone off the top
  balloons = balloons.filter(b => b.y + b.radius > 0);
}

function drawBalloons() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const b of balloons) {
    // Balloon body
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.shadowColor = '#00c7b1';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.closePath();
    ctx.shadowBlur = 0;
    // Balloon string
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + b.radius);
    ctx.lineTo(b.x, b.y + b.radius + 24);
    ctx.strokeStyle = '#7a9bb5';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.closePath();
  }
}

function checkHit(x, y) {
  for (let i = 0; i < balloons.length; i++) {
    const b = balloons[i];
    const dist = Math.sqrt((x - b.x) ** 2 + (y - b.y) ** 2);
    if (dist <= b.radius) {
      balloons.splice(i, 1);
      score++;
      scoreDisplay.textContent = `Score: ${score}`;
      popSound.currentTime = 0;
      popSound.play();
      statusDisplay.textContent = 'Nice shot! 🎈';
      return true;
    }
  }
  missSound.currentTime = 0;
  missSound.play();
  statusDisplay.textContent = 'Missed! Try again.';
  return false;
}

function gameLoop() {
  if (!gameActive) return;
  moveBalloons();
  drawBalloons();
}

function startGame() {
  balloons = [];
  score = 0;
  gameActive = true;
  scoreDisplay.textContent = 'Score: 0';
  statusDisplay.textContent = '';
  clearInterval(spawnInterval);
  clearInterval(moveInterval);
  spawnInterval = setInterval(spawnBalloon, 1200);
  moveInterval = setInterval(gameLoop, 32);
}

function endGame() {
  gameActive = false;
  clearInterval(spawnInterval);
  clearInterval(moveInterval);
  statusDisplay.textContent = `Game Over! Final Score: ${score}`;
}

canvas.addEventListener('click', function(e) {
  if (!gameActive) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  checkHit(x, y);
});

canvas.addEventListener('touchstart', function(e) {
  if (!gameActive) return;
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  const x = touch.clientX - rect.left;
  const y = touch.clientY - rect.top;
  checkHit(x, y);
}, { passive: false });

restartBtn.addEventListener('click', function() {
  startGame();
});

// End game after 60 seconds
setTimeout(endGame, 60000);

window.onload = function() {
  loadSounds();
  startGame();
};
  </script>

</body>
</html>
