<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceNow Releases Quiz | Knowledge26 Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #061525;
      color: #e8f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header-img, .footer-img {
      width: 100%;
      display: block;
      flex-shrink: 0;
    }
    .quiz-wrapper {
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
    }
    .quiz-card {
      background:rgba(10,31,51,0.85);
      border:1px solid rgba(98,216,78,0.15);
      border-radius:12px;
      box-shadow:0 4px 24px rgba(0,0,0,0.18);
      max-width:480px;
      width:100%;
      padding:32px 24px;
      backdrop-filter:blur(8px);
      display:flex;
      flex-direction:column;
      align-items:stretch;
    }
    .quiz-title {
      font-size:2rem;
      font-weight:700;
      margin-bottom:18px;
      color:#62d84e;
      text-align:center;
    }
    .question {
      font-size:1.2rem;
      font-weight:600;
      margin-bottom:16px;
      color:#e8f4f8;
    }
    .options {
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-bottom:18px;
    }
    .option-btn {
      background:linear-gradient(135deg,#62d84e,#00c7b1);
      color:#061525;
      font-weight:700;
      border:none;
      border-radius:10px;
      padding:12px 24px;
      cursor:pointer;
      transition:transform 0.1s,box-shadow 0.1s;
      font-size:1rem;
    }
    .option-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 0 8px #62d84e;
    }
    .feedback {
      font-size:1rem;
      font-weight:500;
      margin-bottom:12px;
      color:#00c7b1;
      text-align:center;
      min-height:24px;
    }
    .score {
      font-size:1.2rem;
      font-weight:700;
      color:#62d84e;
      margin-bottom:18px;
      text-align:center;
    }
    .restart-btn {
      background:linear-gradient(135deg,#00c7b1,#62d84e);
      color:#061525;
      font-weight:700;
      border:none;
      border-radius:10px;
      padding:12px 24px;
      cursor:pointer;
      font-size:1rem;
      margin-top:12px;
      transition:transform 0.1s,box-shadow 0.1s;
    }
    .restart-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 0 8px #00c7b1;
    }
    @media (max-width:600px) {
      .quiz-card { padding:18px 8px; }
      .quiz-title { font-size:1.3rem; }
    }
  </style>
</head>
<body>
  <img src="https://github.com/Knowledge26/spokes-ai-agents/blob/main/header-banner.png" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
  <div class="quiz-wrapper">
    <div class="quiz-card">
      <div class="quiz-title">ServiceNow Releases Quiz</div>
      <div class="score" id="score"></div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="restart-btn" id="restartBtn" style="display:none;">Restart Quiz</button>
    </div>
  </div>
  <img src="https://github.com/Knowledge26/spokes-ai-agents/blob/main/footer-banner.png" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
  <script>
    // --- JAVASCRIPT FIRST ---
    const quizData = [
      {
        question: "What was the codename for the ServiceNow release in 2020?",
        options: ["Orlando", "Paris", "Quebec", "Rome"],
        answer: 0
      },
      {
        question: "Which ServiceNow release introduced the Now Experience UI Framework?",
        options: ["London", "Orlando", "Paris", "Quebec"],
        answer: 2
      },
      {
        question: "What is the primary programming language used for ServiceNow server-side scripting?",
        options: ["Python", "JavaScript", "Java", "C#"],
        answer: 1
      },
      {
        question: "Which of these is NOT a ServiceNow release codename?",
        options: ["Istanbul", "Madrid", "Berlin", "Rome"],
        answer: 2
      },
      {
        question: "What feature was introduced in the ServiceNow Quebec release?",
        options: ["Flow Designer", "Virtual Agent", "App Engine Studio", "Service Portal"],
        answer: 2
      }
    ];
    let current = 0;
    let score = 0;
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const feedbackEl = document.getElementById('feedback');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restartBtn');

    function showQuestion() {
      scoreEl.textContent = `Question ${current+1} of ${quizData.length}`;
      questionEl.textContent = quizData[current].question;
      optionsEl.innerHTML = '';
      feedbackEl.textContent = '';
      quizData[current].options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => selectOption(idx);
        optionsEl.appendChild(btn);
      });
    }

    function selectOption(idx) {
      const correct = quizData[current].answer;
      Array.from(optionsEl.children).forEach((btn, i) => {
        btn.disabled = true;
        if(i === correct) btn.style.border = '2px solid #62d84e';
        if(i === idx && idx !== correct) btn.style.border = '2px solid #e74c3c';
      });
      if(idx === correct) {
        feedbackEl.textContent = 'Correct! 🎉';
        score++;
      } else {
        feedbackEl.textContent = `Incorrect. The correct answer is: ${quizData[current].options[correct]}`;
      }
      setTimeout(() => {
        current++;
        if(current < quizData.length) {
          showQuestion();
        } else {
          showScore();
        }
      }, 1400);
    }

    function showScore() {
      questionEl.textContent = 'Quiz Complete!';
      optionsEl.innerHTML = '';
      feedbackEl.textContent = '';
      scoreEl.textContent = `Your Score: ${score} / ${quizData.length}`;
      restartBtn.style.display = 'inline-block';
    }

    restartBtn.onclick = () => {
      current = 0;
      score = 0;
      restartBtn.style.display = 'none';
      showQuestion();
    };

    // Start quiz
    showQuestion();
  </script>
</body>
</html>
