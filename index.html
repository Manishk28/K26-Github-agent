<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spokes AI Agents | Knowledge26 Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #061525;
      color: #e8f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header-img, .footer-img {
      width: 100%;
      display: block;
      flex-shrink: 0;
    }
    .quiz-card {
      background: rgba(10,31,51,0.85);
      border: 1px solid rgba(98,216,78,0.15);
      border-radius: 12px;
      box-shadow: 0 4px 24px 0 rgba(0,199,177,0.08);
      max-width: 420px;
      width: 100%;
      padding: 32px 28px 28px 28px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .quiz-title {
      font-size: 2rem;
      font-weight: 700;
      color: #62d84e;
      margin-bottom: 8px;
      text-align: center;
    }
    .quiz-question {
      font-size: 1.15rem;
      font-weight: 500;
      color: #e8f4f8;
      margin-bottom: 12px;
      text-align: center;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .quiz-option {
      background: rgba(6,21,37,0.8);
      border: 1px solid rgba(98,216,78,0.2);
      color: #e8f4f8;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
      outline: none;
      text-align: left;
    }
    .quiz-option:hover:not([disabled]), .quiz-option:focus-visible:not([disabled]) {
      border-color: #62d84e;
      background: rgba(98,216,78,0.08);
      color: #62d84e;
      box-shadow: 0 0 0 2px #62d84e33;
    }
    .quiz-option[disabled] {
      opacity: 0.7;
      cursor: default;
    }
    .quiz-feedback {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 8px;
      min-height: 28px;
      text-align: center;
    }
    .quiz-feedback.correct {
      color: #62d84e;
    }
    .quiz-feedback.incorrect {
      color: #ff5c5c;
    }
    .quiz-score {
      font-size: 1.2rem;
      font-weight: 700;
      color: #00c7b1;
      margin-top: 12px;
      text-align: center;
    }
    .quiz-btn {
      background: linear-gradient(135deg, #62d84e, #00c7b1);
      color: #061525;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px 24px;
      border: none;
      font-size: 1rem;
      margin-top: 18px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 8px 0 rgba(98,216,78,0.12);
    }
    .quiz-btn:hover, .quiz-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(98,216,78,0.25);
    }
    @media (max-width: 600px) {
      .quiz-card {
        padding: 18px 6px 16px 6px;
        max-width: 98vw;
      }
      .quiz-title {
        font-size: 1.3rem;
      }
      .quiz-question {
        font-size: 1rem;
      }
      .quiz-score {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div class="quiz-card" id="quiz-card">
      <div class="quiz-title">ServiceNow Releases Quiz</div>
      <div class="quiz-question" id="quiz-question"></div>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <div class="quiz-score" id="quiz-score"></div>
      <button class="quiz-btn" id="quiz-next-btn" style="display:none;">Next Question</button>
      <button class="quiz-btn" id="quiz-restart-btn" style="display:none;">Play Again</button>
    </div>
  </div>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
  <script>
    // ServiceNow Releases Quiz Game
    const quizData = [
      {
        question: "Which ServiceNow release introduced Flow Designer?",
        options: [
          "Istanbul (2017)",
          "Kingston (2018)",
          "London (2018)",
          "Madrid (2019)"
        ],
        answer: 1
      },
      {
        question: "What is the codename for the ServiceNow release in Q1 2023?",
        options: [
          "San Diego",
          "Tokyo",
          "Utah",
          "Vancouver"
        ],
        answer: 2
      },
      {
        question: "Which feature was first introduced in the Paris release?",
        options: [
          "Virtual Agent",
          "Predictive Intelligence",
          "Mobile Agent App",
          "AI Search"
        ],
        answer: 3
      },
      {
        question: "Which release marked the introduction of the Now Experience UI Framework?",
        options: [
          "Orlando (2020)",
          "Paris (2020)",
          "Quebec (2021)",
          "Rome (2021)"
        ],
        answer: 2
      },
      {
        question: "What is the main focus of the San Diego release?",
        options: [
          "Next Experience UI",
          "Flow Designer",
          "Predictive Intelligence",
          "IntegrationHub"
        ],
        answer: 0
      }
    ];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    const questionEl = document.getElementById('quiz-question');
    const optionsEl = document.getElementById('quiz-options');
    const feedbackEl = document.getElementById('quiz-feedback');
    const scoreEl = document.getElementById('quiz-score');
    const nextBtn = document.getElementById('quiz-next-btn');
    const restartBtn = document.getElementById('quiz-restart-btn');
    function showQuestion() {
      const q = quizData[currentQuestion];
      questionEl.textContent = q.question;
      optionsEl.innerHTML = '';
      feedbackEl.textContent = '';
      feedbackEl.className = 'quiz-feedback';
      scoreEl.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
      nextBtn.style.display = 'none';
      restartBtn.style.display = 'none';
      answered = false;
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.textContent = opt;
        btn.tabIndex = 0;
        btn.onclick = () => selectOption(idx);
        btn.onkeyup = (e) => { if (e.key === 'Enter' || e.key === ' ') btn.click(); };
        optionsEl.appendChild(btn);
      });
    }
    function selectOption(idx) {
      if (answered) return;
      answered = true;
      const q = quizData[currentQuestion];
      const optionBtns = optionsEl.querySelectorAll('.quiz-option');
      optionBtns.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.answer) btn.style.borderColor = '#62d84e';
        if (i === idx && i !== q.answer) btn.style.borderColor = '#ff5c5c';
      });
      if (idx === q.answer) {
        feedbackEl.textContent = 'Correct!';
        feedbackEl.className = 'quiz-feedback correct';
        score++;
      } else {
        feedbackEl.textContent = `Incorrect. Correct answer: ${q.options[q.answer]}`;
        feedbackEl.className = 'quiz-feedback incorrect';
      }
      if (currentQuestion < quizData.length - 1) {
        nextBtn.style.display = 'inline-block';
      } else {
        scoreEl.textContent = `Final Score: ${score} / ${quizData.length}`;
        restartBtn.style.display = 'inline-block';
      }
    }
    nextBtn.onclick = () => {
      currentQuestion++;
      showQuestion();
    };
    restartBtn.onclick = () => {
      currentQuestion = 0;
      score = 0;
      showQuestion();
    };
    // Start game
    showQuestion();
  </script>
</body>
</html>
