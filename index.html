<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spokes AI Agents | Knowledge26 Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #061525;
      color: #e8f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header-img, .footer-img {
      width: 100%;
      display: block;
      flex-shrink: 0;
    }
    .game-card {
      background: rgba(10,31,51,0.85);
      border: 1px solid rgba(98,216,78,0.15);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 20px rgba(98,216,78,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .game-title {
      font-size: 2rem;
      font-weight: 700;
      color: #62d84e;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .instructions {
      color: #7a9bb5;
      font-size: 1rem;
      margin-bottom: 18px;
      text-align: center;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 12px;
      margin-bottom: 18px;
    }
    .cell {
      background: rgba(6,21,37,0.8);
      border: 1px solid rgba(98,216,78,0.2);
      color: #e8f4f8;
      border-radius: 8px;
      font-size: 2.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      box-shadow: 0 0 8px rgba(98,216,78,0.08);
    }
    .cell:hover {
      border-color: #62d84e;
      box-shadow: 0 0 12px #62d84e33;
      transform: translateY(-2px);
    }
    .status {
      font-size: 1.1rem;
      color: #00c7b1;
      margin-bottom: 16px;
      min-height: 24px;
      text-align: center;
    }
    .reset-btn {
      background: linear-gradient(135deg, #62d84e, #00c7b1);
      color: #061525;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px 24px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .reset-btn:hover {
      box-shadow: 0 0 16px #62d84e66;
      transform: translateY(-2px);
    }
    @media (max-width: 600px) {
      .game-card {
        padding: 18px 6px;
        max-width: 98vw;
      }
      .board {
        grid-template-columns: repeat(3, 40px);
        grid-template-rows: repeat(3, 40px);
        gap: 8px;
      }
      .cell {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div class="game-card">
      <div class="game-title">Tic-Tac-Toe: User vs AI</div>
      <div class="instructions">Take turns placing X (you) and O (AI) on the board. First to get 3 in a row wins! Click a cell to make your move. The AI will respond instantly. Click "Reset Game" to start over.</div>
      <div class="status" id="status">Your turn! 🧞</div>
      <div class="board" id="board">
        <div class="cell" id="cell-0"></div>
        <div class="cell" id="cell-1"></div>
        <div class="cell" id="cell-2"></div>
        <div class="cell" id="cell-3"></div>
        <div class="cell" id="cell-4"></div>
        <div class="cell" id="cell-5"></div>
        <div class="cell" id="cell-6"></div>
        <div class="cell" id="cell-7"></div>
        <div class="cell" id="cell-8"></div>
      </div>
      <button class="reset-btn" id="resetBtn">Reset Game</button>
    </div>
  </div>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
  <script>
    // Tic-Tac-Toe Game Logic
    const board = Array(9).fill(null);
    let userTurn = true;
    let gameActive = true;
    const statusDiv = document.getElementById('status');
    const cells = Array.from({length:9}, (_,i) => document.getElementById('cell-'+i));
    const resetBtn = document.getElementById('resetBtn');
    const userMark = 'X';
    const aiMark = 'O';
    const winCombos = [
      [0,1,2],[3,4,5],[6,7,8], // rows
      [0,3,6],[1,4,7],[2,5,8], // cols
      [0,4,8],[2,4,6]          // diags
    ];
    const aiTaunts = [
      "Nice try!","I'm thinking...","Can you beat me?","AI strikes again!","Hmm...","Your move!","Let's see what you got!","🧞 says: I'm unbeatable!"
    ];
    function renderBoard() {
      for(let i=0;i<9;i++) {
        cells[i].textContent = board[i] || '';
        cells[i].style.pointerEvents = gameActive && userTurn && !board[i] ? 'auto' : 'none';
      }
    }
    function checkWinner(mark) {
      return winCombos.some(combo => combo.every(idx => board[idx] === mark));
    }
    function checkDraw() {
      return board.every(cell => cell);
    }
    function setStatus(msg) {
      statusDiv.textContent = msg;
    }
    function userMove(idx) {
      if(!gameActive || !userTurn || board[idx]) return;
      board[idx] = userMark;
      renderBoard();
      if(checkWinner(userMark)) {
        setStatus("You win! 🎉");
        gameActive = false;
        return;
      }
      if(checkDraw()) {
        setStatus("It's a draw!");
        gameActive = false;
        return;
      }
      userTurn = false;
      setStatus("AI's turn... " + aiTaunts[Math.floor(Math.random()*aiTaunts.length)]);
      setTimeout(aiMove, 600);
    }
    function aiMove() {
      if(!gameActive) return;
      // AI logic: win → block → center → corner → random
      let move = findBestMove();
      board[move] = aiMark;
      renderBoard();
      if(checkWinner(aiMark)) {
        setStatus("AI wins! 🧞");
        gameActive = false;
        return;
      }
      if(checkDraw()) {
        setStatus("It's a draw!");
        gameActive = false;
        return;
      }
      userTurn = true;
      setStatus("Your turn! 🧞");
    }
    function findBestMove() {
      // 1. Win
      for(let i=0;i<9;i++) {
        if(!board[i]) {
          board[i]=aiMark;
          if(checkWinner(aiMark)) { board[i]=null; return i; }
          board[i]=null;
        }
      }
      // 2. Block
      for(let i=0;i<9;i++) {
        if(!board[i]) {
          board[i]=userMark;
          if(checkWinner(userMark)) { board[i]=null; return i; }
          board[i]=null;
        }
      }
      // 3. Center
      if(!board[4]) return 4;
      // 4. Corners
      const corners = [0,2,6,8].filter(i=>!board[i]);
      if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
      // 5. Random
      const empty = board.map((v,i)=>!v?i:null).filter(i=>i!==null);
      return empty[Math.floor(Math.random()*empty.length)];
    }
    function resetGame() {
      for(let i=0;i<9;i++) board[i]=null;
      userTurn = true;
      gameActive = true;
      renderBoard();
      setStatus("Your turn! 🧞");
    }
    cells.forEach((cell,i)=>cell.addEventListener('click',()=>userMove(i)));
    resetBtn.addEventListener('click',resetGame);
    renderBoard();
    setStatus("Your turn! 🧞");
  </script>
</body>
</html>
