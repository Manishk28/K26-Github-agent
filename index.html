<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spokes AI Agents | Knowledge26 Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #061525;
      color: #e8f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header-img, .footer-img {
      width: 100%;
      display: block;
      flex-shrink: 0;
    }
    .quiz-card {
      background: rgba(10,31,51,0.85);
      border: 1px solid rgba(98,216,78,0.15);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      max-width: 480px;
      width: 100%;
      padding: 32px 24px;
      box-shadow: 0 4px 24px rgba(98,216,78,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .quiz-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #62d84e;
      text-align: center;
    }
    .quiz-question {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 20px;
      color: #e8f4f8;
      text-align: center;
    }
    .quiz-options {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .quiz-option {
      background: linear-gradient(135deg, #62d84e, #00c7b1);
      color: #061525;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px 24px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      font-size: 1rem;
      box-shadow: 0 0 20px rgba(98,216,78,0.25);
    }
    .quiz-option:hover:not([disabled]) {
      transform: translateY(-2px);
      box-shadow: 0 0 24px #62d84e;
    }
    .quiz-option[disabled] {
      opacity: 0.6;
      cursor: default;
    }
    .quiz-feedback {
      font-size: 1rem;
      margin-bottom: 16px;
      color: #00c7b1;
      min-height: 24px;
      text-align: center;
    }
    .quiz-score {
      font-size: 1.1rem;
      font-weight: 600;
      color: #7a9bb5;
      margin-bottom: 20px;
      text-align: center;
    }
    .quiz-restart {
      background: linear-gradient(135deg, #62d84e, #00c7b1);
      color: #061525;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px 24px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 12px;
      box-shadow: 0 0 20px rgba(98,216,78,0.25);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .quiz-restart:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px #62d84e;
    }
    @media (max-width: 600px) {
      .quiz-card {
        padding: 18px 8px;
        max-width: 98vw;
      }
      .quiz-title {
        font-size: 1.3rem;
      }
      .quiz-question {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div class="quiz-card">
      <div class="quiz-title">ServiceNow Releases Quiz</div>
      <div class="quiz-question" id="quiz-question"></div>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <div class="quiz-score" id="quiz-score"></div>
      <button class="quiz-restart" id="quiz-restart" style="display:none;">Play Again</button>
    </div>
  </div>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
  <script>
    // ServiceNow Releases Quiz Game
    const quizQuestions = [
      {
        question: "Which ServiceNow release introduced the Flow Designer?",
        options: ["London", "Madrid", "New York", "Orlando"],
        answer: 1
      },
      {
        question: "What is the codename for the ServiceNow release in 2020?",
        options: ["Paris", "Orlando", "Rome", "Quebec"],
        answer: 3
      },
      {
        question: "Which feature was first available in the ServiceNow New York release?",
        options: ["Mobile App", "Virtual Agent", "Flow Designer", "Performance Analytics"],
        answer: 0
      },
      {
        question: "What is the main color theme of ServiceNow's UI16 interface?",
        options: ["Green", "Blue", "Red", "Orange"],
        answer: 0
      },
      {
        question: "Which ServiceNow release introduced Agent Workspace?",
        options: ["Madrid", "Orlando", "Paris", "Rome"],
        answer: 1
      },
      {
        question: "What is the codename for the ServiceNow release in 2022?",
        options: ["San Diego", "Tokyo", "Utah", "Vancouver"],
        answer: 2
      },
      {
        question: "Which ServiceNow release introduced the Now Platform App Engine?",
        options: ["Madrid", "New York", "Orlando", "Paris"],
        answer: 0
      },
      {
        question: "What year was the ServiceNow London release launched?",
        options: ["2017", "2018", "2019", "2020"],
        answer: 1
      },
      {
        question: "Which ServiceNow release introduced Predictive Intelligence?",
        options: ["Madrid", "New York", "Orlando", "Paris"],
        answer: 1
      },
      {
        question: "What is the codename for the ServiceNow release in 2023?",
        options: ["Tokyo", "Utah", "Vancouver", "Washington"],
        answer: 2
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let quizEnded = false;

    const questionElem = document.getElementById('quiz-question');
    const optionsElem = document.getElementById('quiz-options');
    const feedbackElem = document.getElementById('quiz-feedback');
    const scoreElem = document.getElementById('quiz-score');
    const restartBtn = document.getElementById('quiz-restart');

    function showQuestion() {
      if (currentQuestion < quizQuestions.length) {
        const q = quizQuestions[currentQuestion];
        questionElem.textContent = `Q${currentQuestion+1}: ${q.question}`;
        optionsElem.innerHTML = '';
        feedbackElem.textContent = '';
        scoreElem.textContent = `Score: ${score} / ${quizQuestions.length}`;
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'quiz-option';
          btn.textContent = opt;
          btn.onclick = () => selectAnswer(idx);
          optionsElem.appendChild(btn);
        });
      } else {
        endQuiz();
      }
    }

    function selectAnswer(selectedIdx) {
      const q = quizQuestions[currentQuestion];
      Array.from(optionsElem.children).forEach(btn => btn.disabled = true);
      if (selectedIdx === q.answer) {
        feedbackElem.textContent = "Correct! 🧞";
        score++;
      } else {
        feedbackElem.textContent = `Incorrect. The correct answer is: ${q.options[q.answer]}`;
      }
      scoreElem.textContent = `Score: ${score} / ${quizQuestions.length}`;
      setTimeout(() => {
        currentQuestion++;
        showQuestion();
      }, 1200);
    }

    function endQuiz() {
      quizEnded = true;
      questionElem.textContent = "Quiz Complete!";
      optionsElem.innerHTML = '';
      feedbackElem.textContent = '';
      scoreElem.textContent = `Final Score: ${score} / ${quizQuestions.length}`;
      restartBtn.style.display = 'inline-block';
    }

    restartBtn.onclick = () => {
      currentQuestion = 0;
      score = 0;
      quizEnded = false;
      restartBtn.style.display = 'none';
      showQuestion();
    };

    // Start the quiz
    showQuestion();
  </script>
</body>
</html>
